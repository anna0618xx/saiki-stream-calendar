name: Saiki public feed and Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '14 1,13 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: saiki-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install beautifulsoup4 pillow
      - name: Check curated parser fixtures
        run: python scripts/test_collect.py
      - name: Update public broadcast feed
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FETCH_WIKI: ${{ (github.event_name != 'schedule' || github.event.schedule == '14 1,13 * * *') && '1' || '0' }}
        run: python scripts/collect.py
      - name: Commit updated public feed only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/streams.json data/streams.js data/thumbnail_cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public Saiki metadata [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
