name: Saiki public feed and Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    # 05:00 and 17:00 Japan Standard Time (UTC+9) = 20:00 and 08:00 UTC.
    - cron: '0 8,20 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  # Isolated from stale #15 in GitHub's previous concurrency group.
  group: saiki-pages-recovered
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # On UI-only pushes, publish directly without querying YouTube/Wiki.
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'
      - name: Install parser
        if: github.event_name != 'push'
        run: python -m pip install beautifulsoup4 pillow
      - name: Check curated parser fixtures
        if: github.event_name != 'push'
        run: |
          python scripts/test_collect.py
          python scripts/test_goods.py
      - name: Refresh public Wiki goods candidates
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/collect_goods.py
      - name: Update public broadcast feed
        if: github.event_name != 'push'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FETCH_WIKI: '1'
        run: python scripts/collect.py
      - name: Commit updated public feed only
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/streams.json data/streams.js data/thumbnail_cache.json data/goods_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public Saiki metadata [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
